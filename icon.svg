<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#2d3748"/>

  <!-- Hexagon shape -->
  <defs>
    <clipPath id="hex">
      <polygon points="256,64 384,148 384,316 256,400 128,316 128,148"/>
    </clipPath>
  </defs>

  <!-- Main hexagon with gradient -->
  <polygon points="256,64 384,148 384,316 256,400 128,316 128,148"
           fill="url(#grad1)" stroke="#4299e1" stroke-width="8"/>

  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3182ce;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- Number token -->
  <circle cx="256" cy="232" r="60" fill="#f7fafc" opacity="0.95"/>
  <circle cx="256" cy="232" r="54" fill="#c1121f"/>
  <text x="256" y="255" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        fill="#f7fafc" text-anchor="middle">8</text>

  <!-- Resource icons (simplified) -->
  <!-- Wood -->
  <circle cx="180" cy="320" r="20" fill="#2f7d32" opacity="0.8"/>
  <!-- Brick -->
  <circle cx="240" cy="340" r="20" fill="#b04b3a" opacity="0.8"/>
  <!-- Sheep -->
  <circle cx="272" cy="340" r="20" fill="#7ed957" opacity="0.8"/>
  <!-- Wheat -->
  <circle cx="332" cy="320" r="20" fill="#e6c84e" opacity="0.8"/>

  <!-- App name -->
  <text x="256" y="470" font-family="Arial, sans-serif" font-size="36" font-weight="bold"
        fill="#4299e1" text-anchor="middle">CATAN</text>
</svg>

